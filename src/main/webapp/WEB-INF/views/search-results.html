<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Search results')}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<section id="page-content">
    <div class="container mt-4">
        <div th:replace="~{fragments/search-form :: search-form}"></div>
        <div th:if="${searchError}" class="alert alert-warning mt-3" role="alert">
            <span th:text="${searchError}">Invalid search query</span>
        </div>

        <div th:if="${searchError == null}">
            <h2>Locations:</h2>
            <div class="row">
                <div class="col-12" th:if="${allLocations == null or #arrays.isEmpty(allLocations)}">
                    No locations found.
                </div>
                <div class="col-12 col-lg-3 col-md-6 mb-4"
                     th:each="location : ${allLocations}">
                    <div th:replace="~{fragments/location-card :: location-card(${location})}"></div>
                </div>
            </div>
        </div>
    </div>
</section>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
